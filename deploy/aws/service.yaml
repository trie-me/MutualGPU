AWSTemplateFormatVersion: '2010-09-09'
Description: MutualGPU demo public ALB and single-task ECS service.

Parameters:
  FoundationStackName:
    Type: String
    Default: mutualgpu-foundation
  ImageUri:
    Type: String
    Description: Immutable ECR image URI, preferably pinned by digest.
  CertificateArn:
    Type: String
    Description: Issued ACM certificate ARN for the public HTTPS listener.
  DeploymentSecretArn:
    Type: String
    Description: ARN of the Secrets Manager JSON secret named mutualgpu/deployment.
  ApplicationDataBucketName:
    Type: String
    Default: mutualgpu-data
    Description: Dedicated S3 bucket for MutualGPU task state, inputs, and result artifacts.
  ProviderKeyBucketName:
    Type: String
    Default: mutualgpu-preshared-keys
    Description: Dedicated S3 bucket for provider-key bindings only.
  ProviderCorsOrigin0:
    Type: String
    Default: 'https://huggingface.co'
    Description: Exact Chrome-provider origin. No wildcard matching is enabled.
  ProviderCorsOrigin1:
    Type: String
    Default: 'https://vercel.com'
    Description: Exact Chrome-provider origin. No wildcard matching is enabled.
  ProviderCorsOrigin2:
    Type: String
    Default: 'https://yosun-triposplat-webgpu-demo.static.hf.space'
    Description: Exact Chrome-provider origin. No wildcard matching is enabled.
  ProviderEnrollmentRateLimit:
    Type: Number
    Default: 10
    MinValue: 10
    Description: Maximum provider-identifier mints per source IP during one minute.

Conditions:
  HasProviderCorsOrigin0: !Not [!Equals [!Ref ProviderCorsOrigin0, '']]
  HasProviderCorsOrigin1: !Not [!Equals [!Ref ProviderCorsOrigin1, '']]
  HasProviderCorsOrigin2: !Not [!Equals [!Ref ProviderCorsOrigin2, '']]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: mutualgpu-demo
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue: !Sub '${FoundationStackName}-AlbSecurityGroupId'
      Subnets:
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetAId'
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetBId'
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '600'
        - Key: client_keep_alive.seconds
          Value: '604800'
      Tags:
        - Key: Project
          Value: MutualGPU

  ProviderEnrollmentWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: mutualgpu-provider-enrollment
      Scope: REGIONAL
      Description: Limits anonymous provider-identifier minting while leaving enrollment open to everyone.
      DefaultAction:
        Allow: {}
      CustomResponseBodies:
        enrollmentRateLimited:
          ContentType: APPLICATION_JSON
          Content: '{"code":"enrollment_rate_limited"}'
      Rules:
        - Name: provider-enrollment-rate-limit
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: enrollmentRateLimited
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref ProviderEnrollmentRateLimit
              EvaluationWindowSec: 60
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: EXACTLY
                        SearchString: /api/webgpu-enrollments
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: providerEnrollmentRateLimit
            SampledRequestsEnabled: false
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: mutualgpuProviderEnrollment
        SampledRequestsEnabled: false
      Tags:
        - Key: Project
          Value: MutualGPU

  ProviderEnrollmentWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt ProviderEnrollmentWebAcl.Arn

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mutualgpu-web
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/live
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'

  GrpcTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mutualgpu-grpc
      TargetType: ip
      Protocol: HTTP
      ProtocolVersion: GRPC
      Port: 8081
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      # Kestrel's native gRPC port is HTTP/2 only. ALB's standard gRPC health
      # method is intentionally not implemented by the application, which
      # produces the expected gRPC UNIMPLEMENTED status (12).
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /AWS.ALB/healthcheck
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        GrpcCode: '12'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  GrpcRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /mutualgpu.v1.ProviderControl/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrpcTargetGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: mutualgpu-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '2048'
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${FoundationStackName}-TaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${FoundationStackName}-TaskRoleArn'
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
            - ContainerPort: 8081
              Protocol: tcp
              AppProtocol: grpc
          Environment:
            - Name: ASPNETCORE_ENVIRONMENT
              Value: Production
            - Name: MutualGPU__TrustForwardedProto
              Value: 'true'
            - Name: MutualGPU__TrustedProxyNetworks__0
              Value: 10.42.0.0/20
            - Name: MutualGPU__TrustedProxyNetworks__1
              Value: 10.42.16.0/20
            - Name: MutualGPU__ProviderKeyS3__BucketName
              Value: !Ref ProviderKeyBucketName
            - Name: MutualGPU__ProviderKeyS3__Region
              Value: us-east-1
            - Name: MutualGPU__S3__BucketName
              Value: !Ref ApplicationDataBucketName
            - Name: MutualGPU__S3__Region
              Value: us-east-1
            - !If
              - HasProviderCorsOrigin0
              - Name: MutualGPU__ProviderCorsOrigins__0
                Value: !Ref ProviderCorsOrigin0
              - !Ref AWS::NoValue
            - !If
              - HasProviderCorsOrigin1
              - Name: MutualGPU__ProviderCorsOrigins__1
                Value: !Ref ProviderCorsOrigin1
              - !Ref AWS::NoValue
            - !If
              - HasProviderCorsOrigin2
              - Name: MutualGPU__ProviderCorsOrigins__2
                Value: !Ref ProviderCorsOrigin2
              - !Ref AWS::NoValue
          Secrets:
            - Name: MutualGPU__Admin__MasterPassword
              ValueFrom: !Sub '${DeploymentSecretArn}:adminMasterPassword::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/mutualgpu-api
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - HttpsListener
      - GrpcRule
    Properties:
      ServiceName: mutualgpu-api
      Cluster:
        Fn::ImportValue: !Sub '${FoundationStackName}-EcsClusterArn'
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub '${FoundationStackName}-ApiSecurityGroupId'
          Subnets:
            - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetAId'
            - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetBId'
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref WebTargetGroup
        - ContainerName: api
          ContainerPort: 8081
          TargetGroupArn: !Ref GrpcTargetGroup
      Tags:
        - Key: Project
          Value: MutualGPU

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  HttpsUrl:
    Value: !Sub 'https://${LoadBalancer.DNSName}'
  ServiceName:
    Value: !GetAtt Service.Name
