AWSTemplateFormatVersion: '2010-09-09'
Description: MutualGPU public ALB and one ARM64 EC2-backed ECS service using clean PostgreSQL and S3 state.

Parameters:
  FoundationStackName:
    Type: String
    Default: mutualgpu-foundation
  ImageUri:
    Type: String
    AllowedPattern: '^428590861908\.dkr\.ecr\.us-east-1\.amazonaws\.com/mutualgpu-api@sha256:[a-f0-9]{64}$'
    ConstraintDescription: Must be the reviewed Quinn-MutualCompute ECR image URI pinned by immutable digest.
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:428590861908:certificate/[0-9a-f-]+$'
    ConstraintDescription: Must be an ACM certificate ARN in target account 428590861908 and us-east-1.
  PublicApiHost:
    Type: String
    Default: mutualgpu.com
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$'
    ConstraintDescription: Must be the DNS hostname covered by CertificateArn, without a scheme or path.
    Description: Public DNS hostname covered by CertificateArn and routed to this load balancer.
  DeploymentSecretArn:
    Type: String
    AllowedPattern: '^arn:aws:secretsmanager:us-east-1:428590861908:secret:mutualgpu/deployment-[A-Za-z0-9]+$'
    ConstraintDescription: Must be the target mutualgpu/deployment secret ARN without exposing its value.
  DesiredCount:
    Type: Number
    Default: 1
    AllowedValues:
      - 0
      - 1
    Description: Use 1 for the approved steady state; 0 is available for a reviewed stop-before-start operation.
  ProviderCorsOrigin0:
    Type: String
    Default: 'https://huggingface.co'
    Description: Exact Chrome-provider origin. No wildcard matching is enabled.
  ProviderCorsOrigin1:
    Type: String
    Default: 'https://vercel.com'
    Description: Exact Chrome-provider origin. No wildcard matching is enabled.
  ProviderCorsOrigin2:
    Type: String
    Default: 'https://yosun-triposplat-webgpu-demo.static.hf.space'
    Description: Exact Chrome-provider origin. No wildcard matching is enabled.
  ProviderEnrollmentRateLimit:
    Type: Number
    Default: 10
    MinValue: 10
    Description: Maximum provider-identifier mints per source IP during one minute.

Conditions:
  HasProviderCorsOrigin0: !Not [!Equals [!Ref ProviderCorsOrigin0, '']]
  HasProviderCorsOrigin1: !Not [!Equals [!Ref ProviderCorsOrigin1, '']]
  HasProviderCorsOrigin2: !Not [!Equals [!Ref ProviderCorsOrigin2, '']]

Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: mutualgpu-demo
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - Fn::ImportValue: !Sub '${FoundationStackName}-AlbSecurityGroupId'
      Subnets:
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetAId'
        - Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetBId'
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '600'
        - Key: client_keep_alive.seconds
          Value: '604800'
      Tags:
        - Key: Name
          Value: mutualgpu-demo
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  ProviderEnrollmentWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: mutualgpu-provider-enrollment
      Scope: REGIONAL
      Description: Limits anonymous provider-identifier minting while leaving enrollment open to everyone.
      DefaultAction:
        Allow: {}
      CustomResponseBodies:
        enrollmentRateLimited:
          ContentType: APPLICATION_JSON
          Content: '{"code":"enrollment_rate_limited"}'
      Rules:
        - Name: provider-enrollment-rate-limit
          Priority: 0
          Action:
            Block:
              CustomResponse:
                ResponseCode: 429
                CustomResponseBodyKey: enrollmentRateLimited
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: !Ref ProviderEnrollmentRateLimit
              EvaluationWindowSec: 60
              ScopeDownStatement:
                AndStatement:
                  Statements:
                    - ByteMatchStatement:
                        FieldToMatch:
                          Method: {}
                        PositionalConstraint: EXACTLY
                        SearchString: POST
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: EXACTLY
                        SearchString: /api/webgpu-enrollments
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: providerEnrollmentRateLimit
            SampledRequestsEnabled: false
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: mutualgpuProviderEnrollment
        SampledRequestsEnabled: false
      Tags:
        - Key: Name
          Value: mutualgpu-provider-enrollment
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  ProviderEnrollmentWebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref LoadBalancer
      WebACLArn: !GetAtt ProviderEnrollmentWebAcl.Arn

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mutualgpu-web
      TargetType: instance
      Protocol: HTTP
      Port: 8080
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /health/ready
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
      Tags:
        - Key: Name
          Value: mutualgpu-web
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  GrpcTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: mutualgpu-grpc
      TargetType: instance
      Protocol: HTTP
      ProtocolVersion: GRPC
      Port: 8081
      VpcId:
        Fn::ImportValue: !Sub '${FoundationStackName}-VpcId'
      # Kestrel's native gRPC port is HTTP/2 only. ALB's standard gRPC health
      # method is intentionally not implemented by the application, which
      # produces the expected gRPC UNIMPLEMENTED status (12).
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /AWS.ALB/healthcheck
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        GrpcCode: '12'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '15'
      Tags:
        - Key: Name
          Value: mutualgpu-grpc
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301
      Tags:
        - Key: Name
          Value: mutualgpu-http
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      ListenerAttributes:
        - Key: routing.http.response.content_security_policy.header_value
          Value:
            Fn::Sub:
              - >-
                default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob: https://api.producthunt.com https://${BucketName}.s3.${AWS::Region}.amazonaws.com; connect-src 'self' https://cdn.jsdelivr.net https://huggingface.co https://*.hf.co https://*.xethub.hf.co; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'
              - BucketName:
                  Fn::ImportValue: !Sub '${FoundationStackName}-ApplicationDataBucketName'
      Tags:
        - Key: Name
          Value: mutualgpu-https
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  GrpcRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /mutualgpu.v1.ProviderControl/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GrpcTargetGroup
      Tags:
        - Key: Name
          Value: mutualgpu-grpc
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Ingress
        - Key: Lifecycle
          Value: Persistent

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: mutualgpu-api
      RequiresCompatibilities:
        - EC2
      NetworkMode: bridge
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn:
        Fn::ImportValue: !Sub '${FoundationStackName}-TaskExecutionRoleArn'
      TaskRoleArn:
        Fn::ImportValue: !Sub '${FoundationStackName}-TaskRoleArn'
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          Cpu: 256
          MemoryReservation: 256
          Memory: 384
          PortMappings:
            - ContainerPort: 8080
              HostPort: 8080
              Protocol: tcp
              AppProtocol: http
            - ContainerPort: 8081
              HostPort: 8081
              Protocol: tcp
              AppProtocol: grpc
          Environment:
            - Name: ASPNETCORE_ENVIRONMENT
              Value: Production
            - Name: MutualGPU__Security__AllowArbitraryBrowserTaskWriteOrigins
              Value: 'true'
            - Name: MutualGPU__TrustForwardedProto
              Value: 'true'
            - Name: MutualGPU__TrustedProxyNetworks__0
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetACidr'
            - Name: MutualGPU__TrustedProxyNetworks__1
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-PublicSubnetBCidr'
            - Name: MutualGPU__S3__BucketName
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-ApplicationDataBucketName'
            - Name: MutualGPU__S3__Region
              Value: us-east-1
            - Name: MutualGPU__ProviderKeyS3__BucketName
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-ApplicationDataBucketName'
            - Name: MutualGPU__ProviderKeyS3__Region
              Value: us-east-1
            - Name: MutualGPU__Csp__S3ImageOrigin
              Value:
                Fn::Sub:
                  - 'https://${BucketName}.s3.${AWS::Region}.amazonaws.com'
                  - BucketName:
                      Fn::ImportValue: !Sub '${FoundationStackName}-ApplicationDataBucketName'
            - Name: MutualGPU__Postgres__Host
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-DatabaseEndpointAddress'
            - Name: MutualGPU__Postgres__Port
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-DatabaseEndpointPort'
            - Name: MutualGPU__Postgres__Database
              Value:
                Fn::ImportValue: !Sub '${FoundationStackName}-DatabaseName'
            - Name: MutualGPU__Postgres__Username
              Value: mutualgpu
            - Name: MutualGPU__Postgres__RequireTls
              Value: 'true'
            - Name: MutualGPU__Postgres__MinimumPoolSize
              Value: '1'
            - Name: MutualGPU__Postgres__MaximumPoolSize
              Value: '5'
            - !If
              - HasProviderCorsOrigin0
              - Name: MutualGPU__ProviderCorsOrigins__0
                Value: !Ref ProviderCorsOrigin0
              - !Ref AWS::NoValue
            - !If
              - HasProviderCorsOrigin1
              - Name: MutualGPU__ProviderCorsOrigins__1
                Value: !Ref ProviderCorsOrigin1
              - !Ref AWS::NoValue
            - !If
              - HasProviderCorsOrigin2
              - Name: MutualGPU__ProviderCorsOrigins__2
                Value: !Ref ProviderCorsOrigin2
              - !Ref AWS::NoValue
          Secrets:
            - Name: MutualGPU__Admin__MasterPassword
              ValueFrom: !Sub '${DeploymentSecretArn}:adminMasterPassword::'
            - Name: MutualGPU__Postgres__Password
              ValueFrom:
                Fn::Join:
                  - ''
                  - - Fn::ImportValue: !Sub '${FoundationStackName}-DatabaseSecretArn'
                    - ':password::'
            - Name: MutualGPU__Postgres__HandleEncryptionKey
              ValueFrom: !Sub '${DeploymentSecretArn}:taskHandleEncryptionKey::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/mutualgpu-api
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
      Tags:
        - Key: Name
          Value: mutualgpu-api
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Compute
        - Key: Lifecycle
          Value: Persistent

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - HttpListener
      - HttpsListener
      - GrpcRule
    Properties:
      ServiceName: mutualgpu-api
      Cluster:
        Fn::ImportValue: !Sub '${FoundationStackName}-EcsClusterArn'
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      CapacityProviderStrategy:
        - CapacityProvider:
            Fn::ImportValue: !Sub '${FoundationStackName}-EcsCapacityProviderName'
          Base: 1
          Weight: 1
      HealthCheckGracePeriodSeconds: 120
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref WebTargetGroup
        - ContainerName: api
          ContainerPort: 8081
          TargetGroupArn: !Ref GrpcTargetGroup
      Tags:
        - Key: Name
          Value: mutualgpu-api
        - Key: Application
          Value: MutualGPU
        - Key: Project
          Value: MutualGPU
        - Key: Environment
          Value: Production
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Owner
          Value: Quinn-MutualCompute
        - Key: Component
          Value: Compute
        - Key: Lifecycle
          Value: Persistent

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  HttpsUrl:
    Description: Certificate-valid public API base URL.
    Value: !Sub 'https://${PublicApiHost}'
  LoadBalancerHttpsUrl:
    Description: Raw ALB HTTPS URL. Use only for infrastructure diagnostics; it is not certificate-valid unless CertificateArn covers this hostname.
    Value: !Sub 'https://${LoadBalancer.DNSName}'
  ServiceName:
    Value: !GetAtt Service.Name
