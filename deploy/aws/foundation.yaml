AWSTemplateFormatVersion: '2010-09-09'
Description: "MutualGPU foundation: network, private PostgreSQL, image repository, ECS, logs, and roles."

Parameters:
  ApplicationDataBucketName:
    Type: String
    Default: mutualgpu-data
    Description: Dedicated S3 bucket for MutualGPU task state, inputs, and result artifacts.
  DatabaseName:
    Type: String
    Default: mutualgpu
    AllowedPattern: '^[a-zA-Z][a-zA-Z0-9_]+$'

Resources:
  MutualGpuVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: mutualgpu-demo-vpc
        - Key: Project
          Value: MutualGPU

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: mutualgpu-demo-igw
        - Key: Project
          Value: MutualGPU

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref MutualGpuVpc

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.0.0/20
      MapPublicIpOnLaunch: true
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-demo-public-a
        - Key: Project
          Value: MutualGPU

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.16.0/20
      MapPublicIpOnLaunch: true
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-demo-public-b
        - Key: Project
          Value: MutualGPU

  DatabaseSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.32.0/20
      MapPublicIpOnLaunch: false
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-database-a
        - Key: Project
          Value: MutualGPU

  DatabaseSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.48.0/20
      MapPublicIpOnLaunch: false
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-database-b
        - Key: Project
          Value: MutualGPU

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-demo-public
        - Key: Project
          Value: MutualGPU

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MutualGPU public HTTPS ingress
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - Description: Redirect HTTP to HTTPS at the load balancer
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: Public HTTPS API and requestor UI
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-demo-alb
        - Key: Project
          Value: MutualGPU

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MutualGPU API ports accepted only from the ALB
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - Description: HTTP/1.1 web, REST, WebSocket, and SSE traffic
          IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref AlbSecurityGroup
        - Description: Native gRPC traffic
          IpProtocol: tcp
          FromPort: 8081
          ToPort: 8081
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-demo-api
        - Key: Project
          Value: MutualGPU

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: MutualGPU PostgreSQL accepted only from ECS API tasks
      SecurityGroupIngress:
        - Description: PostgreSQL from the MutualGPU API
          IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
      VpcId: !Ref MutualGpuVpc
      Tags:
        - Key: Name
          Value: mutualgpu-postgres
        - Key: Project
          Value: MutualGPU

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: MutualGPU private database subnets
      SubnetIds:
        - !Ref DatabaseSubnetA
        - !Ref DatabaseSubnetB
      Tags:
        - Key: Project
          Value: MutualGPU

  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mutualgpu/postgres
      GenerateSecretString:
        SecretStringTemplate: '{"username":"mutualgpu"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: MutualGPU

  DatabaseParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: MutualGPU PostgreSQL TLS policy
      Family: postgres18
      Parameters:
        rds.force_ssl: '1'

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: mutualgpu-postgres
      Engine: postgres
      EngineVersion: '18'
      DBName: !Ref DatabaseName
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      PubliclyAccessible: false
      MultiAZ: false
      Port: 5432
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      DBParameterGroupName: !Ref DatabaseParameterGroup
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      EnablePerformanceInsights: true
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Project
          Value: MutualGPU

  ImageRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: mutualgpu-api
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      Tags:
        - Key: Project
          Value: MutualGPU

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: mutualgpu-demo
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Project
          Value: MutualGPU

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/mutualgpu-api
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mutualgpu-ecs-task-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadMutualGpuDeploymentSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:mutualgpu/*'
      Tags:
        - Key: Project
          Value: MutualGPU

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: mutualgpu-ecs-task
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AccessMutualGpuStorage
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationDataBucketName}'
              - Effect: Allow
                Action:
                  - s3:PutBucketCORS
                  - s3:DeleteBucketCORS
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ApplicationDataBucketName}'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationDataBucketName}/mutualgpu/v3/requestors/*/tasks/*/inputs/*'
                  - !Sub 'arn:${AWS::Partition}:s3:::${ApplicationDataBucketName}/mutualgpu/v3/requestors/*/tasks/*/results/*'
      Tags:
        - Key: Project
          Value: MutualGPU

Outputs:
  VpcId:
    Value: !Ref MutualGpuVpc
    Export:
      Name: !Sub '${AWS::StackName}-VpcId'
  PublicSubnetAId:
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetAId'
  PublicSubnetBId:
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetBId'
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-AlbSecurityGroupId'
  ApiSecurityGroupId:
    Value: !Ref ApiSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ApiSecurityGroupId'
  DatabaseEndpointAddress:
    Value: !GetAtt Database.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseEndpointAddress'
  DatabaseEndpointPort:
    Value: !GetAtt Database.Endpoint.Port
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseEndpointPort'
  DatabaseName:
    Value: !Ref DatabaseName
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseName'
  DatabaseSecretArn:
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub '${AWS::StackName}-DatabaseSecretArn'
  EcrRepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-EcrRepositoryUri'
  EcsClusterArn:
    Value: !GetAtt Cluster.Arn
    Export:
      Name: !Sub '${AWS::StackName}-EcsClusterArn'
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TaskExecutionRoleArn'
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TaskRoleArn'
